name: Asset Integrity
on:
  push:
    branches: [develop/v0.4, fix/g0-asset-integrity]
  pull_request:
    branches: [develop/v0.4, main]
jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python check_assets.py --output asset-integrity-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-integrity-report
          path: asset-integrity-report.json
