  function spawnLitter(id){
    const source=['bottle','can','wrapper'];
    const entries=Array.from({length:3},(_,i)=>({id:'litter-'+i,kind:source[Math.floor(Math.random()*source.length)]}));
    if(Math.random()<0.38)entries.push({id:'litter-warning',kind:'hook'});

    return entries.map((item,i)=>{
      let x=20,y=30;
      for(let tries=0;tries<80;tries++){
        x=16+Math.random()*68;y=25+Math.random()*57;
        const nearSpec=spots.some(p=>Math.hypot(p.x-x,p.y-y)<15);

      return {...item,x:Math.round(x),y:Math.round(y)};
    });

  }
  async function shareLevel(){
    const title=`我完成了《赶海日记》第 ${state.level} 关，还发现了海岸守护行动！`;
    const url=location.href.split('#')[0];
    try{if(navigator.share){await navigator.share({title,text:'一起探索潮汐的秘密，学习爱护海洋。',url});return;}
      if(navigator.clipboard){await navigator.clipboard.writeText(url);toast('试玩链接已复制，可以分享给朋友');return;}
      toast('可复制浏览器地址分享，微信小游戏原生分享待接入。');
    }catch(e){toast('分享已取消，仍可以通过浏览器地址分享。');}
  }
  function showSpecimen(id){const s=species[id],found=state.save.seen.includes(id);if(!found){toast('还没找到这个生物，去海滩探索吧');return;}document.getElementById('dialogLayer').innerHTML=`<div class="overlay" data-close="1"><div class="dialog" role="dialog" aria-modal="true" aria-label="生物介绍"><div class="dialogIllustration">${icon(id,130)}</div><h2>${s.name}</h2><p>${s.about}</p><span class="reward">${s.rarity} · ${s.type} · 已发现 ${state.save.found[id]} 次</span><div class="dialogActions"><button class="primaryBtn" data-close="1">继续收藏</button></div></div></div>`;}
  function showWin(){const l=levels[state.level-1];const last=state.level===3;document.getElementById('dialogLayer').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="通关成功"><div class="dialogIllustration">${icon(state.level===2?'hermit':'star',130)}</div><h2>发现完成！</h2><p>你顺利探索了「${l.place}」<br>大海把今天的小惊喜都送给你啦。</p><span class="reward">手账贴纸 +1 · 关卡 ${state.level}/3</span><div class="dialogActions">${last?`<button class="primaryBtn" data-go="room">参观收藏小屋 →</button>`:`<button class="primaryBtn" data-level="${state.level+1}">下一片海滩 →</button>`}<button class="secondaryBtn" data-share="1">分享我的发现</button><button class="secondaryBtn" data-go="map">返回地图</button></div></div></div>`;}
  function render(){const pages={home,map,game,book,room,eco,about};document.getElementById('app').innerHTML=(pages[state.page]||home)();nav();document.getElementById('dialogLayer').innerHTML='';if(state.showWin)showWin();}
  document.body.addEventListener('click',e=>{const target=e.target.closest('[data-go],[data-level],[data-spot],[data-trash],[data-sort],[data-craft],[data-share],[data-net],[data-filter],[data-species],[data-close]');if(!target)return;const d=target.dataset;if(d.close){state.activeTrashId=null;document.getElementById('dialogLayer').innerHTML='';return;}if(d.share){shareLevel();return;}if(d.sort){chooseTrash(d.sort);return;}if(d.trash){sortTrash(d.trash);return;}if(d.craft){makeCraft(d.craft);return;}if(d.go){go(d.go);return;}if(d.level){startLevel(Number(d.level));return;}if(d.spot){collect(d.spot);return;}if(d.net){state.net=!state.net;render();toast(state.net?'小捞网准备好啦，现在点小鱼！':'小捞网已放回背包');return;}if(d.filter){state.bookType=d.filter;render();return;}if(d.species){showSpecimen(d.species);return;}});
  render();
})();
</script></body></html>
